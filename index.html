<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="apple-touch-icon" sizes="96x96" href="/96.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/16.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bulma@1.0.2/css/bulma.min.css"
    />
    <title>Cypher Beautifier</title>
  </head>
  <body>
    <div id="app">
      <h1>Cypher Beautifier</h1>
      <div class="block">Format your cypher queries</div>
      <div class="block">
        <label>
          Cypher Input:
          <textarea
            id="input"
            name="input"
            class="textarea is-info"
            placeholder="Your cypher"
          ></textarea>
        </label>
      </div>
      <div class="block options">
        <label class="checkbox">
          <input name="parse-strings" id="parse-strings" type="checkbox" />
          Format queries inside strings
        </label>
        <label>
          Keywords
          <span class="select">
            <select id="keyword-case" name="keyword-case">
              <option value="upper">UPPERCASE</option>
              <option value="lower">lowercase</option>
              <option value="preserve">As written</option>
            </select>
          </span>
        </label>
        <label>
          Indent
          <input
            id="indent"
            name="indent"
            class="input"
            type="number"
            min="0"
            max="8"
            value="2"
          />
        </label>
        <label>
          Max width
          <input
            id="max-width"
            name="max-width"
            class="input"
            type="number"
            min="20"
            max="200"
            value="80"
          />
        </label>
      </div>
      <div class="block">
        <label>
          Beautified Cypher Output:
          <textarea
            id="output"
            name="output"
            class="textarea is-success"
            placeholder="Beautified cypher will be displayed here"
          ></textarea>
        </label>
      </div>

      <div class="footer">
        <div>
          <label>
            Made by
            <a href="https://gaidarji.com" target="_blank">Dmitrii Gaidarji</a>
            <a
              href="https://github.com/dmitriigaidarji/cypher-beautifier"
              target="_blank"
              >(source)</a
            >
          </label>
        </div>

        <div>
          <label>
            Used in
            <a
              href="https://pfizer-digital-manufacturing.github.io/neo4j-browser/"
              target="_blank"
              >Neo4j Browser Fork</a
            >
            <a
              href="https://github.com/Pfizer-Digital-Manufacturing/neo4j-browser"
              target="_blank"
              >(source)</a
            >
          </label>
        </div>
      </div>
    </div>
    <script type="module" src="/src/web/main.ts"></script>
    <script
      defer
      src="https://cloud.umami.is/script.js"
      data-website-id="7d081da3-26da-4612-b016-d9460bb6b69a"
    ></script>
  </body>
</html>
