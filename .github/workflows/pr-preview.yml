# Builds a testable preview of the demo for every pull request.
#
# The live site (cypher.gaidarji.com) is deployed from the "GitHub Actions"
# Pages source, which serves exactly one site — so per-PR Pages URLs are not
# available without changing the repository's Pages source. Instead this builds
# the demo into a single self-contained HTML file and attaches it to the run:
# download it, open it, and the PR's version of the beautifier runs locally
# with no server and no network.
#
# It also posts the before/after formatting of every fixture in cyphers/, so
# most changes can be reviewed without downloading anything at all.
name: PR preview

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: pr-preview-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install

      - run: npm run test

      - run: npm run build

      - name: Build self-contained preview
        env:
          PREVIEW_LABEL: >-
            Preview build of PR #${{ github.event.pull_request.number }}
            (${{ github.event.pull_request.head.sha }})
        run: npm run build-preview

      - name: Upload preview
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: cypher-beautifier-preview-${{ github.event.pull_request.number || github.run_id }}
          path: build-preview/index.html
          retention-days: 14

      - name: Format the sample queries
        id: report
        run: |
          {
            echo 'report<<PR_PREVIEW_EOF'
            node scripts/format-report.mjs || true
            echo 'PR_PREVIEW_EOF'
          } >> "$GITHUB_OUTPUT"

      # A pull request from a fork gets a read-only token, so commenting is
      # skipped there. The artifact above is still produced and downloadable.
      - name: Comment with the preview
        if: >-
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- cypher-beautifier-preview -->';
            const artifactUrl = ${{ toJSON(steps.upload.outputs.artifact-url) }};
            let report = ${{ toJSON(steps.report.outputs.report) }};

            // GitHub rejects comments over 65536 characters.
            const limit = 55000;
            if (report.length > limit) {
              report = report.slice(0, limit) +
                '\n\n_…report truncated. Download the preview to see the rest._';
            }

            const body = [
              marker,
              '### 🪄 Cypher Beautifier preview',
              '',
              `**[Download the preview](${artifactUrl})** ` +
                '— unzip it and open `index.html` in a browser. It is fully self-contained, ' +
                'so it needs no server and runs this PR\'s formatter locally.',
              '',
              `Built from \`${context.payload.pull_request.head.sha.slice(0, 7)}\`.`,
              '',
              '---',
              '',
              report,
              '',
              '---',
              '_Generated by [Claude Code](https://claude.ai/code)_',
            ].join('\n');

            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;

            const comments = await github.paginate(
              github.rest.issues.listComments,
              { owner, repo, issue_number },
            );
            const existing = comments.find((c) => c.body?.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner, repo, comment_id: existing.id, body,
              });
            } else {
              await github.rest.issues.createComment({
                owner, repo, issue_number, body,
              });
            }
